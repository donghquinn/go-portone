name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories appear without code changes: re-check every Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
